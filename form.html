<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css_files/form.css">
</head>
<body>


    <div class="container">
        <h3>Add student</h3>
        <form action="/submit" method="post">
                
          <div class="img">
              <img src="/images/student.png" alt="student image">
           </div>
            <div class="former">
            <div class="student id">
        <label for="name">Student ID</label>
        <input type="number"  placeholder="Enter 10-digit ID here......">
            </div>

      <div class="first_name">
          <label for="first_name">First Name:</label>
          <input type="text" id="first_name" name="first_name">
      </div>

      <div class="last_name">
          <label for="last_name">Last Name:</label>
          <input type="text" id="last_name" name="last_name">
      </div>

      <div class="middle_name">
          <label for="middle_name">Middle Name:</label>
          <input type="text" id="middle_name" name="middle_name">
      </div>

      <div class="Email">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email">
      </div>

      <div class="sit_number">
            <label for="sit_number">SIT Number:</label>
            <input type="number" id="sit_number" name="sit_number">
      </div>
    


      <div class="Resgistration_date">
            <label for="registration_date">Registration Date:</label>
            <input type="date" id="registration_date" name="registration_date">
      </div>


      <div class="assigned_course">
          <label for="assigned_course">Assigned Course:</label>
          <input type="text" id="assigned_course" name="assigned_course">
      </div>

        <button type="submit">Submit</button>
        <button type="cancel">Cancel</button>

    </form>
    </div>
    </div>
</body>
</html>
